# The Arrs Stack - youtube.com/@KLTechVideos
# Gluetun - QB - Prowlarr - Sonarr - Radarr - Jellyseerr
services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    volumes:
      - ${STACKS_PATH}/arrs/gluetun:/gluetun
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - OPENVPN_USER=${OPENVPN_USER}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - VPN_PORT_FORWARDING=on
      - PORT_FORWARD_ONLY=true
      - SERVER_REGIONS=${SERVER_REGIONS}
    ports:
      - 8888:8888/tcp # HTTP proxy
      - 8388:8388/tcp # Shadowsocks
      - 8388:8388/udp # Shadowsocks
      - 8080:8080/tcp # qb
      - 9696:9696/tcp # prowlarr
      - 7878:7878/tcp # radarr
      - 8989:8989/tcp # sonarr
      - 8191:8191/tcp # flaresolverr
      - 8000:8000/tcp # gluetun control server
      # - 6767:6767/tcp # bazarr
    networks:
      - default
      - proxy
    restart: unless-stopped
    labels:
      - traefik.enable=true
      # themes
      - traefik.http.middlewares.qb-theme.plugin.themepark.app=qbittorrent
      - traefik.http.middlewares.qb-theme.plugin.themepark.theme=overseerr
      - traefik.http.routers.qb.middlewares=qb-theme
      - traefik.http.middlewares.prowlarr-theme.plugin.themepark.app=prowlarr
      - traefik.http.middlewares.prowlarr-theme.plugin.themepark.theme=overseerr
      - traefik.http.routers.prowlarr.middlewares=prowlarr-theme
      - traefik.http.middlewares.radarr-theme.plugin.themepark.app=radarr
      - traefik.http.middlewares.radarr-theme.plugin.themepark.theme=overseerr
      - traefik.http.routers.radarr.middlewares=radarr-theme
      - traefik.http.middlewares.sonarr-theme.plugin.themepark.app=sonarr
      - traefik.http.middlewares.sonarr-theme.plugin.themepark.theme=overseerr
      - traefik.http.routers.sonarr.middlewares=sonarr-theme
      # qbittorrent
      - traefik.http.routers.qb.entrypoints=websecure
      - traefik.http.routers.qb.rule=Host(`qb.${ARRS_HOST}`)
      - traefik.http.routers.qb.service=qb
      - traefik.http.services.qb.loadbalancer.server.port=8080
      - traefik.http.routers.qb.tls=true
      # prowlarr
      - traefik.http.routers.prowlarr.entrypoints=websecure
      - traefik.http.routers.prowlarr.rule=Host(`prowl.${ARRS_HOST}`)
      - traefik.http.routers.prowlarr.service=prowlarr
      - traefik.http.services.prowlarr.loadbalancer.server.port=9696
      - traefik.http.routers.prowlarr.tls=true
      # radarr
      - traefik.http.routers.radarr.entrypoints=websecure
      - traefik.http.routers.radarr.rule=Host(`rad.${ARRS_HOST}`)
      - traefik.http.routers.radarr.service=radarr
      - traefik.http.services.radarr.loadbalancer.server.port=7878
      - traefik.http.routers.radarr.tls=true
      # sonarr
      - traefik.http.routers.sonarr.entrypoints=websecure
      - traefik.http.routers.sonarr.rule=Host(`son.${ARRS_HOST}`)
      - traefik.http.routers.sonarr.service=sonarr
      - traefik.http.services.sonarr.loadbalancer.server.port=8989
      - traefik.http.routers.sonarr.tls=true
      # gluetun control server
      - traefik.http.routers.gluetun.entrypoints=websecure
      - traefik.http.routers.gluetun.rule=Host(`gt.${ARRS_HOST}`)
      - traefik.http.routers.gluetun.service=gluetun
      - traefik.http.services.gluetun.loadbalancer.server.port=8000
      - traefik.http.routers.gluetun.tls=true
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:${QBITTORRENT_VERSION:-latest}
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      - WEBUI_PORT=8080
      # - DOCKER_MODS=ghcr.io/vuetorrent/vuetorrent-lsio-mod
      # - DOCKER_MODS=ghcr.io/themepark-dev/theme.park:qbittorrent
      - QBITTORRENT_VERSION=${QBITTORRENT_VERSION}
      # - TP_THEME=overseerr
    volumes:
      - ${STACKS_PATH}/arrs/qbit:/config
      - ${STACKS_PATH}/arrs/qbit/modcache:/modcache
      - ${DOWNLOADS_PATH}:/data/downloads
    restart: unless-stopped
    network_mode: service:gluetun
    healthcheck:
      test: ['CMD', 'nc', '-z', '127.0.0.1', '8080']
      interval: 30s # Checked every minute instead of 30 seconds to reduce idle load
      timeout: 30s # Give it up to 10 seconds to respond
      retries: 4 # Allows plenty of time for long torrent re-checks on startup
      start_period: 1m # Docker ignores failures completely during the first 2 minutes of startup
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      # - DOCKER_MODS=ghcr.io/themepark-dev/theme.park:prowlarr
      # - TP_THEME=overseerr
    volumes:
      - ${STACKS_PATH}/arrs/prowlarr/Config:/config
      - ${STACKS_PATH}/arrs/prowlarr/Backup:/data/Backup
      - ${DOWNLOADS_PATH}:/data/downloads
    restart: unless-stopped
    network_mode: service:gluetun
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - TZ=Europe/Madrid
      - HEADLESS=true
    volumes:
      - ${STACKS_PATH}/arrs/flaresolver/config:/config
    restart: unless-stopped
    network_mode: service:gluetun
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      # - DOCKER_MODS=ghcr.io/themepark-dev/theme.park:sonarr
      # - TP_THEME=overseerr
    volumes:
      - ${STACKS_PATH}/arrs/sonarr/Config:/config
      - ${STACKS_PATH}/arrs/sonarr/Backup:/data/Backup
      - ${TV_PATH}:/data/tvshows
      - ${DOWNLOADS_PATH}:/data/downloads
    restart: unless-stopped
    network_mode: service:gluetun
    #depends_on:
    #  qbittorrent:
    #    condition: service_healthy
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      # - DOCKER_MODS=ghcr.io/themepark-dev/theme.park:radarr
      # - TP_THEME=overseerr
    volumes:
      - ${STACKS_PATH}/arrs/radarr/Config:/config
      - ${MOVIES_PATH}:/data/movies
      - ${DOWNLOADS_PATH}:/data/downloads
      - ${STACKS_PATH}/arrs/radarr/Backup:/data/Backup
    restart: unless-stopped
    network_mode: service:gluetun
    #depends_on:
    #  qbittorrent:
    #    condition: service_healthy
  # bazarr:
  #   image: lscr.io/linuxserver/bazarr:latest
  #   container_name: bazarr
  #   environment:
  #     - PUID=1000
  #     - PGID=1000
  #     - TZ=Etc/UTC
  #   volumes:
  #     - ${STACKS_PATH}/arrs/bazarr/config:/config
  #     - ${MOVIES_PATH}:/data/movies #optional
  #     - ${TV_PATH}:/data/tvshows #optional
  #   restart: unless-stopped
  #   network_mode: service:gluetun
networks:
  proxy:
    external: true
  default:
