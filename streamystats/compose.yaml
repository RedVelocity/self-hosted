x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  streamystats:
    image: ghcr.io/fredrikburmester/streamystats-aio:${VERSION:-latest}
    container_name: sst-aio
    # Port 3030 kept for direct access; remove if you only use Traefik
    ports:
      - "3030:3000"
    environment:
      - NODE_ENV=production
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      # Or POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password: replace this line,
      # never set both
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-streamystats}
      - POSTGRES_HOST_AUTH_METHOD=scram-sha-256
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
      - SESSION_SECRET=${SESSION_SECRET}
      # Stable encryption key for server action closures (prevents session breakage on redeploy)
      - NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY}
      # Job server cron configuration (optional)
      - SESSION_POLL_INTERVAL_MS=${SESSION_POLL_INTERVAL_MS:-5000}
      - CRON_ACTIVITY_SYNC=${CRON_ACTIVITY_SYNC:-*/1 * * * *}
      - CRON_RECENT_ITEMS_SYNC=${CRON_RECENT_ITEMS_SYNC:-*/1 * * * *}
      - CRON_USER_SYNC=${CRON_USER_SYNC:-*/1 * * * *}
      - CRON_PEOPLE_SYNC=${CRON_PEOPLE_SYNC:-*/15 * * * *}
      - CRON_EMBEDDINGS_SYNC=${CRON_EMBEDDINGS_SYNC:-*/15 * * * *}
      - CRON_GEOLOCATION_SYNC=${CRON_GEOLOCATION_SYNC:-*/5 * * * *}
      - CRON_FINGERPRINT_SYNC=${CRON_FINGERPRINT_SYNC:-0 4 * * *}
      - CRON_JOB_CLEANUP=${CRON_JOB_CLEANUP:-*/1 * * * *}
      - CRON_OLD_JOB_CLEANUP=${CRON_OLD_JOB_CLEANUP:-0 3 * * *}
      - CRON_FULL_SYNC=${CRON_FULL_SYNC:-0 2 * * *}
      - CRON_DELETED_ITEMS_CLEANUP=${CRON_DELETED_ITEMS_CLEANUP:-0 * * * *}
      # Skip full sync on server startup (set to "true" or "1" to skip)
      - SKIP_STARTUP_FULL_SYNC=${SKIP_STARTUP_FULL_SYNC:-false}
    volumes:
      - streamystats_data:/var/lib/postgresql/data
    shm_size: 1g
    restart: unless-stopped
    # Docker's default 10s stop timeout is not enough for postgres to shut down
    # cleanly, which forces WAL recovery on the next start. This is an upper
    # bound, not a fixed delay.
    stop_grace_period: 60s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 4G
    labels:
      - traefik.enable=true
      - traefik.http.routers.sst.entrypoints=websecure
      - traefik.http.routers.sst.rule=Host(`${SST_HOST}`)
      - traefik.http.routers.sst.service=sst
      - traefik.http.routers.sst.tls=true
      - traefik.http.services.sst.loadbalancer.server.port=3000
    networks:
      - proxy

volumes:
  streamystats_data:

networks:
  proxy:
    external: true